{{- if .Values.dynamoOperator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taas.fullname" . }}-dynamo-operator
  labels:
    {{- include "taas.serviceLabels" (dict "service" "dynamo-operator" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "taas.name" . }}-dynamo-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "taas.serviceLabels" (dict "service" "dynamo-operator" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "taas.localImageNodeSelector" . | nindent 6 }}
      serviceAccountName: {{ include "taas.fullname" . }}-dynamo-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: dynamo-operator
          image: {{ include "taas.image" (dict "repo" .Values.dynamoOperator.image.repository "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dynamoOperator.service.port }}
          env:
            - name: TAAS_NATS_URL
              value: {{ include "taas.natsUrl" . | quote }}
            - name: TAAS_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: taas-secrets
                  key: database-url
            - name: TAAS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: taas-redis-secret
                  key: redis-url
            - name: TAAS_OPERATOR_K8S_ENABLED
              value: {{ ternary "true" "false" .Values.dynamoOperator.operatorK8sEnabled | quote }}
            - name: TAAS_OPERATOR_CRD_MODE
              value: {{ .Values.dynamoOperator.operatorCrdMode | quote }}
            - name: TAAS_DYNAMO_NAMESPACE
              value: {{ .Values.dynamoOperator.dynamoNamespace | quote }}
            - name: TAAS_MOCK_INFERENCE_BASE_URL
              value: {{ .Values.dynamoOperator.mockInferenceBaseUrl | quote }}
            - name: TAAS_DYNAMO_FRONTEND_SERVICE_PORT
              value: {{ .Values.dynamoOperator.dynamoFrontendServicePort | quote }}
            - name: TAAS_NVIDIA_DGD_GROUP
              value: {{ .Values.dynamoOperator.nvidiaDgdGroup | quote }}
            - name: TAAS_NVIDIA_DGD_VERSION
              value: {{ .Values.dynamoOperator.nvidiaDgdVersion | quote }}
            - name: TAAS_NVIDIA_DGD_PLURAL
              value: {{ .Values.dynamoOperator.nvidiaDgdPlural | quote }}
            - name: TAAS_NVIDIA_DGD_RUNTIME_IMAGE
              value: {{ .Values.dynamoOperator.nvidiaDgdRuntimeImage | quote }}
            - name: TAAS_NVIDIA_DGD_PLANNER_IMAGE
              value: {{ .Values.dynamoOperator.nvidiaDgdPlannerImage | quote }}
            - name: TAAS_NVIDIA_DGD_IMAGE_PULL_SECRET_NAME
              value: {{ .Values.dynamoOperator.nvidiaDgdImagePullSecretName | quote }}
            - name: TAAS_NVIDIA_DGD_HF_SECRET_NAME
              value: {{ .Values.dynamoOperator.nvidiaDgdHfSecretName | quote }}
            - name: TAAS_NVIDIA_HF_MODEL_DEFAULT
              value: {{ .Values.dynamoOperator.nvidiaHfModelDefault | quote }}
            - name: TAAS_NVIDIA_FRONTEND_URL_TEMPLATE
              value: {{ .Values.dynamoOperator.nvidiaFrontendUrlTemplate | quote }}
            - name: TAAS_NVIDIA_RESOLVE_FRONTEND_VIA_K8S
              value: {{ ternary "true" "false" .Values.dynamoOperator.nvidiaResolveFrontendViaK8s | quote }}
            - name: TAAS_GLOBAL_PLANNER_NAMESPACE
              value: {{ .Values.dynamoOperator.globalPlannerNamespace | quote }}
            - name: TAAS_METRIC_PULLING_PROMETHEUS_ENDPOINT
              value: {{ .Values.dynamoOperator.metricPullingPrometheusEndpoint | quote }}
          resources:
            {{- toYaml .Values.dynamoOperator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
