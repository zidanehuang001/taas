{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taas.fullname" . }}-web
  labels:
    {{- include "taas.serviceLabels" (dict "service" "web" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  {{- $hp := .Values.web.hostPort | default 0 | int }}
  {{- if gt $hp 0 }}
  # hostPort binds a node port; only one pod per node can use it — RollingUpdate leaves new pod Pending.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "taas.name" . }}-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/web-nginx: {{ include "taas.web.nginx.conf" . | sha256sum }}
      labels:
        {{- include "taas.serviceLabels" (dict "service" "web" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "taas.localImageNodeSelector" . | nindent 6 }}
      containers:
        - name: nginx
          image: {{ include "taas.image" (dict "repo" .Values.web.image.repository "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
              {{- $hp := .Values.web.hostPort | default 0 | int }}
              {{- if gt $hp 0 }}
              hostPort: {{ $hp }}
              {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "taas.fullname" . }}-web-nginx
{{- end }}
