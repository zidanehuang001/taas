{{- if and .Values.secrets.autoCreate (not (lookup "v1" "Secret" .Release.Namespace "taas-db-secret")) }}
apiVersion: v1
kind: Secret
metadata:
  name: taas-db-secret
  labels:
    {{- include "taas.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.dbPassword is required when secrets.autoCreate=true" .Values.secrets.dbPassword | quote }}
  postgres-password: {{ required "secrets.dbPassword is required when secrets.autoCreate=true" .Values.secrets.dbPassword | quote }}
{{- end }}
{{- if and .Values.secrets.autoCreate (not (lookup "v1" "Secret" .Release.Namespace "taas-redis-secret")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: taas-redis-secret
  labels:
    {{- include "taas.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ required "secrets.redisPassword is required when secrets.autoCreate=true" .Values.secrets.redisPassword | quote }}
  redis-url: {{ printf "redis://:%s@%s.%s.svc.cluster.local:6379/0" .Values.secrets.redisPassword (include "taas.redisHost" .) .Release.Namespace | quote }}
{{- end }}
{{- if and .Values.secrets.autoCreate (not (lookup "v1" "Secret" .Release.Namespace "taas-secrets")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: taas-secrets
  labels:
    {{- include "taas.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ printf "postgresql://taas:%s@%s.%s.svc.cluster.local:5432/taas?sslmode=disable" .Values.secrets.dbPassword (include "taas.postgresqlHost" .) .Release.Namespace | quote }}
  jwt-signing-key: {{ required "secrets.jwtSigningKey is required when secrets.autoCreate=true" .Values.secrets.jwtSigningKey | quote }}
  litellm-master-key: {{ required "secrets.litellmMasterKey is required when secrets.autoCreate=true" .Values.secrets.litellmMasterKey | quote }}
  litellm-webhook-secret: {{ required "secrets.litellmWebhookSecret is required when secrets.autoCreate=true" .Values.secrets.litellmWebhookSecret | quote }}
{{- end }}
