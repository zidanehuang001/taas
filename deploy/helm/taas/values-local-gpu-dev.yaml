# Layer on values-local.yaml: non-production gateway (TAAS_ENV=development) but real deploy lifecycle —
# no instant "running" in DB; NATS + dynamo-operator drive status and endpoint.
#
# Default here: operator creates DynamoGraphDeployment (vLLM agg) in namespace `dynamo` — matches
# dynamo-platform on this cluster. Requires DGD CRD + GPU nodes + pullable vllm-runtime image.
#
# Deploy (builds & imports dynamo-operator image):
#   L20_GPU_DEV=1 ./scripts/deploy-local-k8s.sh
#
# Inference: gateway proxies /v1/* to a single TAAS_DYNAMO_FRONTEND_URL. After a UI deploy succeeds,
# point it at the new Frontend Service (or run):
#   DYNAMO_NS=dynamo ./scripts/bind-taas-dynamo-frontend.sh
#
# If your platform uses another namespace, override at install time:
#   --set dynamoOperator.dynamoNamespace=dynamo-system

gateway:
  simulateDeployCompletion: false
  # Set after first successful deploy + Frontend Service exists, or use bind-taas-dynamo-frontend.sh
  dynamoFrontendUrl: ""
  useClusterMockDynamo: false

mockDynamo:
  enabled: false

dynamoOperator:
  enabled: true
  operatorK8sEnabled: true
  operatorCrdMode: nvidia_dgd
  dynamoNamespace: dynamo
  mockInferenceBaseUrl: ""
  nvidiaDgdRuntimeImage: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.1.1
  nvidiaDgdPlannerImage: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.1.1
  globalPlannerNamespace: dynamo-system-gp-ctrl
  metricPullingPrometheusEndpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  # Present on clusters with dynamo-platform + hf-token-secret (override to "" if unused)
  nvidiaDgdHfSecretName: hf-token-secret
