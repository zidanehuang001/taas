# Default values for TaaS Helm chart.
# Override with values-dev.yaml, values-staging.yaml, values-prod.yaml

global:
  imageRegistry: ghcr.io/taas-platform
  imagePullSecrets: []
  # imagePullSecrets:
  #   - name: taas-registry-secret
  storageClass: ""

image:
  tag: "latest"
  pullPolicy: IfNotPresent

# For local-image development with image.pullPolicy=Never. When set, TaaS pods
# built by scripts/deploy-local-k8s.sh are pinned to the node that has the
# imported local images.
localImages:
  nodeName: ""

# ─── API Gateway ─────────────────────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 2
  envName: production
  dynamoFrontendUrl: ""
  litellmProxyUrl: ""
  corsAllowedOrigins: []
  image:
    repository: taas-gateway
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 9090
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rate-limit: "1000"
    hosts:
      - host: api.taas.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: taas-tls
        hosts:
          - api.taas.io
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ─── Auth Service ─────────────────────────────────────────────────────────────
auth:
  enabled: true
  replicaCount: 2
  image:
    repository: taas-auth
  service:
    port: 8081
    metricsPort: 9091
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    jwtExpirySeconds: 3600
    refreshTokenExpiryDays: 30
    bcryptCost: 12

# ─── Token Manager ────────────────────────────────────────────────────────────
tokenManager:
  enabled: true
  replicaCount: 2
  image:
    repository: taas-token-manager
  service:
    port: 8082
    metricsPort: 9092
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── Billing Service ─────────────────────────────────────────────────────────
billing:
  enabled: true
  replicaCount: 1
  image:
    repository: taas-billing
  service:
    port: 8083
    metricsPort: 9093
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ─── Dynamo Operator (Python) ─────────────────────────────────────────────────
dynamoOperator:
  enabled: true
  replicaCount: 1
  image:
    repository: taas-dynamo-operator
  service:
    port: 8000
  operatorK8sEnabled: false
  operatorCrdMode: nvidia_dgd
  dynamoNamespace: dynamo
  mockInferenceBaseUrl: ""
  dynamoFrontendServicePort: 8000
  nvidiaDgdGroup: nvidia.com
  nvidiaDgdVersion: v1alpha1
  nvidiaDgdPlural: dynamographdeployments
  nvidiaDgdRuntimeImage: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
  nvidiaDgdPlannerImage: ""
  nvidiaDgdImagePullSecretName: ngc-regcred
  nvidiaDgdHfSecretName: hf-token-secret
  nvidiaHfModelDefault: Qwen/Qwen3-0.6B
  nvidiaFrontendUrlTemplate: "http://{dgd_name}-frontend.{namespace}.svc.cluster.local:{port}"
  nvidiaResolveFrontendViaK8s: true
  globalPlannerNamespace: dynamo-system-gp-ctrl
  metricPullingPrometheusEndpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  nvidiaDgdComponentRbac: true
  # ServiceAccounts that DGD frontend/worker pods run under. NVIDIA's DGD operator places these pods on
  # `dynamo-platform-dynamo-operator-component` by default; we keep `dgd-components` for backward compatibility
  # with older charts where users overrode the SA name.
  nvidiaDgdComponentServiceAccountNames:
    - dynamo-platform-dynamo-operator-component
    - dgd-components
  serviceAccount:
    create: true
    name: taas-dynamo-operator
  rbac:
    create: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── Model Registry (Python) ─────────────────────────────────────────────────
modelRegistry:
  enabled: true
  replicaCount: 1
  image:
    repository: taas-model-registry
  service:
    port: 8084
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  storage:
    type: s3  # s3 or local
    bucket: taas-models
    region: us-east-1

# ─── SLA Monitor (Python) ────────────────────────────────────────────────────
slaMonitor:
  enabled: true
  replicaCount: 1
  image:
    repository: taas-sla-monitor
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── PostgreSQL (Bitnami subchart) ───────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    database: taas
    username: taas
    existingSecret: taas-db-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  readReplicas:
    replicaCount: 1

# ─── Redis (Bitnami subchart) ────────────────────────────────────────────────
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: taas-redis-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 10Gi
  replica:
    replicaCount: 1

# ─── External NATS ───────────────────────────────────────────────────────────
nats:
  url: "nats://taas-nats:4222"
  credentialsSecret: taas-nats-secret
  embedded:
    enabled: false
    image: nats:2.10-alpine

# ─── Observability ───────────────────────────────────────────────────────────
observability:
  otlpEndpoint: "http://jaeger-collector:4317"
  prometheusEnabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s

prometheus:
  enabled: false

# ─── Secrets (externally managed) ───────────────────────────────────────────
secrets:
  autoCreate: false
  # Set these via --set or values override, never commit real values
  jwtSigningKey: ""
  dbPassword: ""
  redisPassword: ""
  natsCredentials: ""
  litellmMasterKey: ""
  litellmWebhookSecret: ""

# ─── Web Dashboard (React + nginx) ───────────────────────────────────────────
web:
  enabled: false
  replicaCount: 1
  containerPort: 8080
  hostPort: 0
  image:
    repository: taas-web
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts: []
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ─── Mock Dynamo (no GPU local dev) ──────────────────────────────────────────
mockDynamo:
  enabled: false
  image:
    repository: taas-mock-dynamo
  containerPort: 9090
  service:
    port: 9090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ─── LiteLLM Proxy (data plane) ──────────────────────────────────────────────
litellm:
  enabled: false
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-latest
    pullPolicy: IfNotPresent
  configPath: /app/config.yaml
  service:
    port: 4000

localDeps:
  enabled: false

# ─── Network Policies ────────────────────────────────────────────────────────
networkPolicy:
  enabled: true

# ─── Pod Disruption Budgets ──────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1
